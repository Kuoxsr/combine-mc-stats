[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY",      # copyright header
  "T201",     # print() — this is a CLI tool, printing is the point
  "PTH123",   # reminder to use Path.open (obsolete)
  "UP015",    # redundant open (asks you to remove "r" from "open", because it's default)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",     # assert
    "D",        # docstrings
    "ANN",      # type annotations
    "PLR2004",  # magic values
    "S105",     # hardcoded passwords
    "S106",     # hardcoded credentials
    "SLF001",   # private access
    "T20",      # print
    "ARG",      # unused args (fixtures)
    "FBT",      # boolean positional flags
    "S311",     # pseudo-random generator
    "INP001",   # __init__.py warning
    "E501",     # line-length
]   

[tool.ruff.lint.pydocstyle]
convention = "pep257"   

